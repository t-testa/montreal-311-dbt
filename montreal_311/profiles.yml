montreal_311:
  target: dev
  outputs:
    dev:
      type: duckdb
      # Relative paths resolve from where dbt is run (montreal_311/). Set MONTREAL_311_DB
      # (absolute path) to point at another file, e.g. the sample database used in CI.
      path: "{{ env_var('MONTREAL_311_DB', '../data/montreal_311.duckdb') }}"
      schema: main
      threads: 4
